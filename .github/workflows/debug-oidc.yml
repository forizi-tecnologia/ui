name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Decode OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          node -e "const p=process.argv[1].split('.')[1];const s=Buffer.from(p.replace(/-/g,'+').replace(/_/g,'/'),'base64').toString();console.log(JSON.stringify(JSON.parse(s),null,2))" "$TOKEN"

      - name: Try npm token exchange
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "--- exchange response ---"
          curl -sS -o body.json -w "HTTP %{http_code}\n" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@forizi-tecnologia%2Fui" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Length: 0" \
            --data ""
          cat body.json
